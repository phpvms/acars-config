name: 'Build'
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
jobs:
  artifacts:
    name: 'Create release'
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v3
        with:
          cache: 'npm'

      - name: build
        run: |
          npm install
          npm run build

        # Create a zip from what's in this repo
      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          directory: './dist'
          path: '.'
          filename: '../stable.zip'
          exclusions: ''

        # List all the files that have been created
      - name: 'List files'
        run: |
          find dist/ -maxdepth 2  -type f

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: acars-package
          path: |
            stable.zip
            artifacts/aircraft.json
          overwrite: true

  #
  # Now publish it up
  #
  publish:
    runs-on: ubuntu-latest
    needs: [ 'artifacts' ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: acars-package

      - name: upload to Bunny storage
        env:
          AWS_ACCESS_KEY_ID: acars
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # AWS CLI v2.23+ sends checksum headers many S3-compatible stores reject
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          aws s3 cp stable.zip s3://acars/scripts/v8/stable.zip \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

          # Aircraft configs publish on their own rather than inside the zip: the
          # client fetches them from acars.aircraft_config_url. Versioned so a URL
          # can be pinned to an exact build, plus a -latest alias to point at
          # without editing Replane every release. A tag publishes under its
          # version (v1.1.0 -> aircraft-1.1.0.json), anything else under the last
          # five of the commit sha.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${GITHUB_SHA: -5}"
          fi

          aws s3 cp artifacts/aircraft.json "s3://acars/configs/aircraft-${VERSION}.json" \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

          aws s3 cp artifacts/aircraft.json s3://acars/configs/aircraft-latest.json \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

  #
  # Manually triggered: bump the version, tag it, and publish a GitHub release
  #
  release:
    name: 'Create GitHub release'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v3
        with:
          cache: 'npm'

      - name: bump version
        id: bump
        run: |
          cd src
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: commit and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B "${{ github.ref_name }}"
          git add src/package.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "${{ github.ref_name }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: build
        run: |
          npm install
          npm run build

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          directory: './dist'
          path: '.'
          filename: '../stable.zip'
          exclusions: ''

      - name: upload to Bunny storage
        env:
          AWS_ACCESS_KEY_ID: acars
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # AWS CLI v2.23+ sends checksum headers many S3-compatible stores reject
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          aws s3 cp stable.zip s3://acars/scripts/v8/stable.zip \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

          # Same split as the publish job, but the version is already known here.
          aws s3 cp artifacts/aircraft.json \
            "s3://acars/configs/aircraft-${{ steps.bump.outputs.version }}.json" \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

          aws s3 cp artifacts/aircraft.json s3://acars/configs/aircraft-latest.json \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v${{ steps.bump.outputs.version }}'
          generate_release_notes: true
          files: stable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
