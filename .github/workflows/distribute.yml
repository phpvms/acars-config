name: 'Build'
on:
  pull_request:
  push:
    branches:
      - main
    # A release is created in the GitHub UI; the tag it makes is the release trigger.
    # Tags are bare versions (3.0.0-beta.1), the older ones carry a v (v1.0.1). Both publish.
    tags:
      - 'v*'
      - '[0-9]*'
jobs:
  artifacts:
    name: 'Build scripts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v3
        with:
          cache: 'npm'

      - name: build
        run: |
          npm install
          npm run build

        # Create a zip from what's in this repo
      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          directory: './dist'
          path: '.'
          filename: '../stable.zip'
          exclusions: ''

        # List all the files that have been created
      - name: 'List files'
        run: |
          find dist/ -maxdepth 2  -type f

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: acars-package
          path: |
            stable.zip
            artifacts/aircraft.json
            artifacts/settings.json
          overwrite: true

  #
  # Now publish it up
  #
  #
  # The docs site vendors this repo's type declarations into its ACARS plugin
  # reference (vendor/acars-pdk on phpvms/site). Ask Dokploy to rebuild the
  # site whenever main changes so the reference stays current.
  #
  # Secrets to set on this repo:
  #   DOKPLOY_URL          e.g. https://dokploy.example.com
  #   DOKPLOY_API_KEY      API token from the Dokploy profile settings
  #   DOKPLOY_SITE_APP_ID  applicationId of the phpvms site in Dokploy
  #
  redeploy-site:
    name: 'Rebuild docs site'
    runs-on: ubuntu-latest
    needs: [ 'artifacts' ]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SITE_APP_ID: ${{ secrets.DOKPLOY_SITE_APP_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_SITE_APP_ID" ]; then
            echo "Dokploy secrets not set, skipping site redeploy"
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            "$DOKPLOY_URL/api/application.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -d "{\"applicationId\": \"$DOKPLOY_SITE_APP_ID\"}"

  publish:
    runs-on: ubuntu-latest
    needs: [ 'artifacts' ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: acars-package

      - name: upload to Bunny storage
        env:
          AWS_ACCESS_KEY_ID: acars
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # AWS CLI v2.23+ sends checksum headers many S3-compatible stores reject
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          # A merge to main publishes main.zip, which Replane can point a channel at to
          # test unreleased scripts. Only a release tag replaces stable.zip, the file
          # every client gets by default.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ZIP_NAME="stable.zip"
          else
            ZIP_NAME="main.zip"
          fi

          aws s3 cp stable.zip "s3://acars/scripts/v8/${ZIP_NAME}" \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

          # Aircraft configs publish on their own rather than inside the zip: the
          # client fetches them from acars.aircraft_config_url. Versioned so a URL
          # can be pinned to an exact build, plus an alias to point at without
          # editing Replane every release. A tag publishes under its version
          # (3.0.0-beta.1 or v1.1.0 -> aircraft-3.0.0-beta.1.json / aircraft-1.1.0.json)
          # and moves the -latest alias; anything else publishes under the last five
          # of the commit sha and moves the -main alias, so released clients never
          # pick up unreleased configs.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            ALIAS="latest"
          else
            VERSION="${GITHUB_SHA: -5}"
            ALIAS="main"
          fi

          aws s3 cp artifacts/aircraft.json "s3://acars/configs/aircraft-${VERSION}.json" \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

          aws s3 cp artifacts/aircraft.json "s3://acars/configs/aircraft-${ALIAS}.json" \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

          # Flight thresholds (acars.settings_url) travel the same way as the
          # aircraft configs: a versioned copy plus the same alias.
          aws s3 cp artifacts/settings.json "s3://acars/configs/settings-${VERSION}.json" \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

          aws s3 cp artifacts/settings.json "s3://acars/configs/settings-${ALIAS}.json" \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

        # Same purge the acars release runs (build/release/deploy.mjs postdeploy): the pull zone
        # keeps serving the previous files until it is told to drop them
      - name: purge the CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          if [ -z "$BUNNY_API_KEY" ]; then
            echo "No Bunny API key, skipping CDN purge."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            "https://api.bunny.net/purge?url=https%3A%2F%2Facars.cdn.vmslabs.net%2F*&async=false" \
            -H "AccessKey: $BUNNY_API_KEY"

        # Attach what went to the CDN to the GitHub release the tag belongs to, so the
        # release page holds exactly what shipped.
      - name: attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stable.zip
            artifacts/aircraft.json
            artifacts/settings.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
