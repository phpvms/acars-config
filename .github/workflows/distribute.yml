name: 'Build'
on:
  pull_request:
  push:
    branches:
      - main
      - releases/2.0
    # A release is created in the GitHub UI; the tag it makes is the release trigger.
    # Tags are bare versions (2.1.0), the older ones carry a v (v1.0.1). Both publish.
    tags:
      - 'v*'
      - '[0-9]*'
jobs:
  artifacts:
    name: 'Build scripts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v3
        with:
          cache: 'npm'

      - name: build
        run: |
          npm install
          npm run build

        # Create a zip from what's in this repo
      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: 'zip'
          directory: './dist'
          path: '.'
          filename: '../stable.zip'
          exclusions: ''

        # List all the files that have been created
      - name: 'List files'
        run: |
          find dist/ -maxdepth 2  -type f

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: acars-package
          path: 'stable.zip'
          overwrite: true

  #
  # Now publish it up
  #
  publish:
    runs-on: ubuntu-latest
    needs: [ 'artifacts' ]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/releases/2.0' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: acars-package

      - name: upload to Bunny storage
        env:
          AWS_ACCESS_KEY_ID: acars
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # AWS CLI v2.23+ sends checksum headers many S3-compatible stores reject
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          # A merge to releases/2.0 publishes releases-2.0.zip, which Replane can point a
          # 2.x channel at to test unreleased scripts. Only a release tag replaces
          # stable.zip, the file every 2.x client downloads by default
          # (https://acars.cdn.vmslabs.net/scripts/stable.zip).
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ZIP_NAME="stable.zip"
          else
            ZIP_NAME="releases-2.0.zip"
          fi

          aws s3 cp stable.zip "s3://acars/scripts/${ZIP_NAME}" \
            --endpoint-url https://ny-s3.storage.bunnycdn.com

        # Same purge the acars release runs (build/release/deploy.mjs postdeploy): the pull zone
        # keeps serving the previous files until it is told to drop them
      - name: purge the CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          if [ -z "$BUNNY_API_KEY" ]; then
            echo "No Bunny API key, skipping CDN purge."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            "https://api.bunny.net/purge?url=https%3A%2F%2Facars.cdn.vmslabs.net%2F*&async=false" \
            -H "AccessKey: $BUNNY_API_KEY"

        # Attach the zip that went to the CDN to the GitHub release the tag belongs to,
        # so the release page holds exactly what shipped.
      - name: attach stable.zip to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: stable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
